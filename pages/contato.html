    <main>
        <section class="secao-contato">
            <h1>Fale Conosco</h1>
            <p>Tem alguma dúvida sobre doações, parcerias ou projetos? Envie-nos uma mensagem.</p>
            
            <form action="#" method="POST">
                <fieldset>
                    <legend>Formulário de Atendimento</legend>
                    
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o seu nome completo">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@dominio.com">

                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" name="assunto" placeholder="Assunto da mensagem">

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva a sua mensagem aqui..."></textarea>

                    <button type="submit">Enviar Mensagem</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
